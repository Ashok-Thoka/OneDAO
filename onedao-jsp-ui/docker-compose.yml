services:
  postgres:
    image: postgres:16
    container_name: onedao-postgres
    environment:
      POSTGRES_DB: onedao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - onedao_pgdata:/var/lib/postgresql/data

volumes:
  onedao_pgdata:
